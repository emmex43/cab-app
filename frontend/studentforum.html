<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Forum</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <style>
        .forum-header {
            background-color: #8C1C64;
            /* UNIBEN Purple */
            color: white;
            padding: 40px 0;
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-purple">
        <div class="container">
            <a class="navbar-brand" href="#"><b>UNIBEN Mobility</b></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="Home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="BookRide.html">Book Ride</a></li>
                    <li class="nav-item"><a class="nav-link text-white fw-bold" href="studentforum.html">Forum</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="driverhub.html">Driver's Hub</a></li>
                </ul>
                <a href="Login.html" class="btn btn-yellow ms-lg-3">Student Login</a>
            </div>
        </div>
    </nav><br><br>

    <div class="forum-header">
        <h1>Campus Discussion Board</h1>
        <p>See live updates from drivers and chat with the community.</p>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div id="posts-container">
                    <div class="text-center py-5">
                        <div class="spinner-border text-purple" role="status"></div>
                        <p>Loading discussions...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-purple d-flex flex-column flex-md-row gap-5 " style="padding: 3%;">
        <div>
            <h1 class="h4 mb-3 fw-bold">UNIBEN Mobility Suite</h1>
            <p> Safe, reliable transportation for UNIBEN students</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

    <script>

        const socket = io();

        // Helper function for Voice
        function speak(text) {
            if ('speechSynthesis' in window) {
                const msg = new SpeechSynthesisUtterance(text);
                msg.rate = 1.2;
                window.speechSynthesis.speak(msg);
            }
        }

        // 1. LISTEN FOR REAL-TIME UPDATES
        socket.on('new_forum_post', (data) => {
            speak("New Announcement Posted"); // Voice Alert
            console.log("New post:", data);
            loadForumPosts();
        });

        socket.on('new_forum_comment', (data) => {
            speak("New Reply"); // Voice Alert
            console.log("New comment:", data);
            loadForumPosts();
        });

        // 2. LOAD POSTS
        document.addEventListener('DOMContentLoaded', loadForumPosts);

        async function loadForumPosts() {
            try {
                const response = await fetch('/api/forum/posts');
                const data = await response.json();
                const container = document.getElementById('posts-container');

                if (response.ok && data.posts.length > 0) {
                    container.innerHTML = '';
                    data.posts.forEach(post => {

                        // Build Comments
                        let commentsHtml = '';
                        if (post.comments && post.comments.length > 0) {
                            post.comments.forEach(comment => {
                                // Check if author is driver or student to style differently
                                const badge = comment.author_is_driver
                                    ? '<span class="badge bg-warning text-dark">Driver</span>'
                                    : '<span class="badge bg-secondary">Student</span>';

                                commentsHtml += `
                                    <div class="d-flex border-bottom py-2">
                                        <div class="ms-2 w-100">
                                            <div class="d-flex justify-content-between">
                                                <small class="fw-bold">${comment.author_name} ${badge}</small>
                                                <small class="text-muted" style="font-size:0.7em">${comment.created_at}</small>
                                            </div>
                                            <p class="mb-0 small text-dark">${comment.content}</p>
                                        </div>
                                    </div>
                                `;
                            });
                        } else {
                            commentsHtml = '<p class="text-muted small fst-italic">No replies yet.</p>';
                        }

                        // Build Post Card
                        const postHtml = `
                        <div class="card shadow-sm mb-4 border-0">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <div class="d-flex align-items-center">
                                        <div class="bg-purple text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width:40px; height:40px;">
                                            <i class="fas fa-user-tie"></i>
                                        </div>
                                        <div>
                                            <h5 class="mb-0 fw-bold text-dark">${post.title}</h5>
                                            <small class="text-muted">Driver ${post.author_name} • ${post.created_at}</small>
                                        </div>
                                    </div>
                                </div>
                                <p class="card-text fs-5">${post.content}</p>
                                
                                <hr>
                                
                                <h6 class="small fw-bold text-muted"><i class="far fa-comments"></i> Discussion</h6>
                                <div class="comments-list mb-3" style="max-height: 200px; overflow-y: auto;">
                                    ${commentsHtml}
                                </div>
                                
                                <div class="input-group">
                                    <input type="text" id="input-${post.id}" class="form-control bg-light" placeholder="Reply to this driver...">
                                    <button class="btn btn-purple" onclick="postComment(${post.id})">
                                        <i class="fas fa-paper-plane"></i> Send
                                    </button>
                                </div>
                            </div>
                        </div>`;

                        container.insertAdjacentHTML('beforeend', postHtml);
                    });
                } else {
                    container.innerHTML = `
                        <div class="alert alert-light text-center">
                            <h4>No active discussions</h4>
                            <p>Wait for drivers to post updates about their location.</p>
                        </div>`;
                }
            } catch (error) {
                console.error("Error loading posts:", error);
            }
        }

        // 3. POST COMMENT FUNCTION
        async function postComment(postId) {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to reply.');
                window.location.href = 'Login.html';
                return;
            }

            const inputField = document.getElementById(`input-${postId}`);
            const content = inputField.value;

            if (!content.trim()) return;

            try {
                // Show loading state
                const btn = inputField.nextElementSibling;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                btn.disabled = true;

                const response = await fetch(`/api/forum/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ content: content })
                });

                if (response.ok) {
                    // Success! Socket.io will handle the reload, but we can clear input now
                    inputField.value = '';
                } else {
                    alert("Error posting reply. Try again.");
                }

                // Reset button
                btn.innerHTML = originalText;
                btn.disabled = false;

            } catch (error) {
                console.error(error);
                alert("Network error");
            }
        }
    </script>
</body>

</html>
