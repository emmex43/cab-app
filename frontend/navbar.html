    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
              /* Navbar Cursive Logo */
        .tripuni-cursive-nav {
            font-family: 'Dancing Script', cursive; /* You can change 'Pacifico' to 'Dancing Script' to test it */
            font-size: 1.8rem; /* Cursive fonts need to be slightly larger to be readable */
            color: #FFFFFF;
            text-decoration: none;
            line-height: 1;
        }
        .tripuni-cursive-nav span {
            color: #FACC15; /* Yellow highlight for the 'Uni' part */
        }

        /* Hero Section Cursive Logo */
        .tripuni-cursive-hero {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem; /* Make it huge! */
            color: #FFFFFF;
            margin-bottom: 0;
            line-height: 1.2;
            /* A soft, glowing drop-shadow to make it readable over the dark images */
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.3), 
            0px 0px 20px rgba(140, 28, 100, 0.6); /* Subtle purple glow */
            /* Add a slight tilt for a fast, dynamic mobility feel */
            /* transform: rotate(-2deg);  */
            display: inline-block;
        }
            .tripuni-cursive-hero span {
            color: #FACC15; /* Yellow highlight for the 'Uni' part */
        }

    </style>
</head>
<body>
    
<!-- The Navbar Section -->
<!-- Added shadow-sm for depth, py-2 for breathing room -->
<!-- Removed py-2 to reduce standard padding -->
    <nav id="home" class="navbar navbar-expand-md navbar-dark fixed-top bg-purple shadow-sm">
        <div class="container">
            <!-- Set padding to 0 on the brand link -->
            <a class="navbar-brand tripuni-cursive-nav d-flex align-items-center p-0" href="Home.html">
                <!-- Added negative margins to let the 100px logo overhang the navbar -->
                <img src="../assets/images/logo.png" alt="TripUni Logo" style="height: 100px; width: 100px; margin-top: -15px; margin-bottom: -25px; margin-right: 5px;">
                Trip<span>Uni</span>
            </a>
            
            <!-- Added Accessibility (ARIA) attributes for screen readers -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <!-- Example: Added 'active fw-bold' and aria-current to Home to show it's the current page -->
                    <li class="nav-item">
                        <a class="nav-link text-white active fw-bold" aria-current="page" href="Home.html">Home</a>
                    </li>
                    <li class="nav-item"><a class="nav-link text-white" href="BookRide.html">Book Ride</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="studentforum.html">Forum</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="driverhub.html">Driver's Hub</a></li>
                </ul>
                <!-- Added a slight hover effect class if you have custom CSS, otherwise standard btn works -->
                <a href="Login.html" class="btn btn-yellow ms-lg-4 shadow-sm">Student Login</a>
            </div>
        </div>
    </nav>

  </nav id="home">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
<script>
// Update navbar based on login status
window.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    
    const loginBtn = document.querySelector('a[href="Login.html"]');
    if (token && user) {
        if (user.is_driver) {
            loginBtn.textContent = `Driver: ${user.fullname}`;
            loginBtn.href = 'driverhub.html';
        } else {
            loginBtn.textContent = `Hi, ${user.fullname}`;
            loginBtn.href = 'BookRide.html';
        }
        loginBtn.classList.remove('btn-yellow');
        loginBtn.classList.add('btn-purple');
        
        // Add logout functionality
        loginBtn.addEventListener('click', function(e) {
            if (!e.ctrlKey) { // Only logout on normal click, not Ctrl+click
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'Home.html';
            }
        });
    }
});
</script>
</body>
</html>
