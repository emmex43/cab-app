<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="bootstrap-5.0.2-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
        <!-- Favicon -->
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
        <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
                /* Navbar Cursive Logo */
        .tripuni-cursive-nav {
            font-family: 'Dancing Script', cursive; /* You can change 'Pacifico' to 'Dancing Script' to test it */
            font-size: 1.8rem; /* Cursive fonts need to be slightly larger to be readable */
            color: #FFFFFF;
            text-decoration: none;
            line-height: 1;
        }
        .tripuni-cursive-nav span {
            color: #FACC15; /* Yellow highlight for the 'Uni' part */
        }

        /* Hero Section Cursive Logo */
        .tripuni-cursive-hero {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem; /* Make it huge! */
            color: #FFFFFF;
            margin-bottom: 0;
            line-height: 1.2;
            /* A soft, glowing drop-shadow to make it readable over the dark images */
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.3), 
            0px 0px 20px rgba(140, 28, 100, 0.6); /* Subtle purple glow */
            /* Add a slight tilt for a fast, dynamic mobility feel */
            /* transform: rotate(-2deg);  */
            display: inline-block;
        }
            .tripuni-cursive-hero span {
            color: #FACC15; /* Yellow highlight for the 'Uni' part */
        }
    </style>
</head>
<body>
    
    <!-- Footer Section -->
    <!-- Pls Emmex if you want to configure the footer, do so here -->
<footer class="bg-purple text-white py-5">
    <div class="container">
        <div class="row justify-content-between">
            
            <!-- Left Section: Brand & Copyright -->
            <div class="col-12 col-md-5 mb-4 mb-md-0">
                <div class="d-flex align-items-center mb-3">
                    <!-- Reduced height to 70px and added me-3 for spacing -->
                    <img src="../assets/images/logo.png" alt="TripUni Logo" class="me-3" style="height: 100px; width: 100px;">
                    <h4 class="h2 mb-0 fw-bold tripuni-cursive-hero text-white">
                        Trip<span style="color: #FFC93C;">Uni</span>
                    </h4>
                </div>
                <p class="text-light mb-3 fs-6">
                    Safe, reliable, and affordable transportation for Campus students.
                </p>
                <p class="mb-0">
                    &copy; 2026 TripUni. All rights reserved.
                </p>
            </div>

            <!-- Right Section: Contact Info -->
            <div class="col-12 col-md-5 d-flex flex-column justify-content-center">
                <h5 class="fw-bold mb-3" style="color: #FFC93C;">Reach out to us for enquiries.</h5>
                <div class="d-flex flex-column gap-2">
                    <a href="mailto:admintripuni@gmail.com" class="text-white text-decoration-none">
                        <b>Email:</b> admintripuni@gmail.com
                    </a>
                </div>
            </div>

        </div>
    </div>
</footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
