<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book A Ride</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="stylesheet" href="/index.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

  <style>
    .map-wrapper {
      position: relative;
      border: 2px solid #8C1C64;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 25px;
      height: 300px;
      width: 100%;
    }

    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
    }

    .leaflet-routing-container {
      display: none;
    }

    /* THE GOOGLE BUTTON */
    .google-btn {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background-color: white;
      color: #4285F4;
      border: 1px solid #ddd;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .google-btn:hover {
      transform: translateX(-50%) scale(1.05);
      background-color: #f8f9fa;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-purple">
    <div class="container">
      <a class="navbar-brand" href="#"><b>UNIBEN Mobility</b></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-white" href="Home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="BookRide.html">Book Ride</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="studentforum.html">Forum</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="driverhub.html">Driver's Hub</a></li>
        </ul>
        <a href="Login.html" class="btn btn-yellow ms-lg-3">Student Login</a>
      </div>
    </div>
  </nav><br><br>

  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="h3 mb-4 fw-bold text-center">Where to today?</h2>

      <div id="booking-status" class="alert alert-info text-center shadow-sm"
        style="display:none; width: 100%; max-width: 600px; margin: 0 auto 20px auto; border-radius: 15px;">
        Looking for drivers...
      </div>

      <div class="map-wrapper shadow-sm">
        <div id="map"></div>
        <a id="nav-btn" href="#" target="_blank" class="google-btn">
          <i class="fas fa-location-arrow"></i> Open in Google Maps
        </a>
      </div>

      <div class="row g-4 justify-content-center">
        <div class="col-md-5">
          <div class="card border-0 shadow-sm h-100" style="border-radius: 20px;">
            <div class="card-body p-4">
              <div class="d-flex align-items-center mb-3">
                <div class="bg-purple text-white rounded-circle d-flex justify-content-center align-items-center me-3"
                  style="width: 50px; height: 50px;">
                  <i class="fas fa-taxi fa-lg"></i>
                </div>
                <div>
                  <h5 class="fw-bold mb-0">Book Private Cab</h5>
                  <small class="text-muted">Direct ride to any location</small>
                </div>
              </div>

              <form id="cabForm">
                <div class="form-floating mb-3">
                  <input type="text" class="form-control" id="pickupLocation" placeholder="Current Location" required>
                  <label for="pickupLocation">Pickup Location</label>
                </div>

                <div class="form-floating mb-4">
                  <input type="text" class="form-control" id="dropoffLocation" placeholder="Where to?" required>
                  <label for="dropoffLocation">Destination</label>
                </div>

                <button class="w-100 btn btn-lg btn-purple rounded-pill" type="submit">
                  Request Cab <i class="fas fa-arrow-right ms-2"></i>
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-5">
          <div class="card border-0 shadow-sm h-100" style="border-radius: 20px;">
            <div class="card-body p-4">
              <div class="d-flex align-items-center mb-3">
                <div class="bg-warning text-dark rounded-circle d-flex justify-content-center align-items-center me-3"
                  style="width: 50px; height: 50px;">
                  <i class="fas fa-bus fa-lg"></i>
                </div>
                <div>
                  <h5 class="fw-bold mb-0">Book Shuttle</h5>
                  <small class="text-muted">Fixed Campus Routes</small>
                </div>
              </div>

              <form id="shuttleForm">
                <div class="mb-3">
                  <label class="form-label text-muted small ms-1">Select Route</label>
                  <select class="form-select form-select-lg" name="Destination" id="Destination" required
                    style="border-radius: 10px;">
                    <option selected disabled value="">Choose Destination...</option>
                    <option value="Main Gate/Small Gate">Back Gate to Main Gate (₦100)</option>
                    <option value="New Benin(NB)">Small Gate to New Benin (₦300)</option>
                    <option value="Ring Road(RR)">Small Gate to Ring Road (₦300)</option>
                    <option value="Back Gate">Main Gate to Back Gate (₦100)</option>
                  </select>
                </div>
                <div class="alert alert-light border rounded-3 p-3 mb-4">
                  <small class="text-muted"><i class="fas fa-info-circle me-1"></i> Pickup Point:</small>
                  <div class="fw-bold">UNIBEN Campus Terminals</div>
                </div>
                <button class="w-100 btn btn-lg btn-outline-warning text-dark fw-bold rounded-pill" type="submit">Get
                  Ticket</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="chat-widget" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <button onclick="toggleChat()" class="btn btn-purple rounded-circle shadow-lg"
      style="width: 60px; height: 60px; font-size: 24px; border: 2px solid white;">
      <i class="fas fa-robot"></i>
    </button>
    <div id="chat-window" class="card shadow-lg mb-3"
      style="display: none; width: 300px; height: 400px; position: absolute; bottom: 70px; right: 0;">
      <div class="card-header bg-purple text-white d-flex justify-content-between align-items-center">
        <h6 class="mb-0"><i class="fas fa-brain"></i> AI Assistant</h6>
        <button onclick="toggleChat()" class="btn btn-sm text-white"><i class="fas fa-times"></i></button>
      </div>
      <div id="chat-messages" class="card-body bg-light" style="overflow-y: auto; height: 290px; padding: 10px;"></div>
      <div class="card-footer p-2">
        <div class="input-group">
          <input type="text" id="chat-input" class="form-control form-control-sm" placeholder="Type a question..."
            onkeypress="handleEnter(event)">
          <button onclick="sendMessage()" class="btn btn-sm btn-purple"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

  <script>
    const socket = io();
    let map, routingControl;

    // Default coords (UNIBEN)
    const PICKUP = { lat: 6.342, lng: 5.618 };
    const DEST = { lat: 6.335, lng: 5.620 };

    function initMap() {
      map = L.map('map').setView([6.3392, 5.6176], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Visual Route only (Main Gate -> Hall 2)
      L.Routing.control({
        waypoints: [L.latLng(PICKUP.lat, PICKUP.lng), L.latLng(DEST.lat, DEST.lng)],
        routeWhileDragging: false, show: false, addWaypoints: false, draggableWaypoints: false,
        lineOptions: { styles: [{ color: '#8C1C64', opacity: 0.7, weight: 5 }] }
      }).addTo(map);

      // Default Link
      updateGoogleLink("University of Benin", "Hall 2, Benin City");
    }

    // UPDATE BUTTON DYNAMICALLY
    function updateGoogleLink(start, end) {
      // Creates a real Google Maps Directions Link
      const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(start)}&destination=${encodeURIComponent(end)}&travelmode=driving`;
      document.getElementById('nav-btn').href = url;
    }

    document.addEventListener('DOMContentLoaded', function () {
      initMap();
      if (!localStorage.getItem('token')) { alert('Please login!'); window.location.href = 'Login.html'; }
    });

    socket.on('ride_accepted', (data) => {
      console.log("🔔 Server sent a ride update:", data);

      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(`Driver Found! ${data.driver_name} is coming.`);
        utterance.rate = 1.1;
        utterance.pitch = 1.2;
        window.speechSynthesis.speak(utterance);
      }
      alert(`✅ DRIVER FOUND!\n\nDriver ${data.driver_name} has accepted your ride!\nVehicle: ${data.vehicle}`);

      const status = document.getElementById('booking-status');
      if (status) {
        status.style.display = 'block';
        status.className = 'alert alert-success text-center fw-bold shadow';
        status.innerHTML = `
            <h4 class="fw-bold mb-3"><i class="fas fa-check-circle text-success"></i> Driver Found!</h4>
            
            <div class="text-start bg-white p-3 rounded mt-2 border">
                <p class="mb-2 fs-5">Driver: <strong>${data.driver_name}</strong></p>
                <hr>
                <p class="mb-1"><strong>Vehicle:</strong> ${data.vehicle}</p>
                <p class="mb-1"><strong>Description:</strong> ${data.vehicle_desc}</p>
                <p class="mb-0 text-danger"><strong>ID Number:</strong> ${data.vehicle_id}</p>
            </div>
            
            <div class="mt-3">
                <div class="spinner-grow text-warning spinner-grow-sm"></div>
                <small class="text-muted">Driver is approaching...</small>
            </div>
          `;
      }
    });

    // CAB FORM - Updates Google Link on Submit
    document.getElementById('cabForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const token = localStorage.getItem('token');
      const pickup = document.getElementById('pickupLocation').value;
      const dest = document.getElementById('dropoffLocation').value;

      if (!pickup || !dest) { alert('Please enter locations'); return; }

      // 1. UPDATE THE BUTTON with User's Inputs
      updateGoogleLink(pickup, dest);

      // 2. Send to Backend
      try {
        const response = await fetch('/api/rides/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ ride_type: 'Cab', pickup_location: pickup, destination: dest })
        });

        if (response.ok) {
          // Success Alert
          alert("Request Sent! Check the map button for directions.");

          // Clear Inputs
          document.getElementById('pickupLocation').value = '';
          document.getElementById('dropoffLocation').value = '';

          // SHOW THE SPINNER
          const status = document.getElementById('booking-status');
          status.style.display = 'block';
          status.className = 'alert alert-info text-center fw-bold shadow-sm';
          status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Finding drivers near <strong>${pickup}</strong>...`;
        }
      } catch (e) { console.error(e); }
    });

    // SHUTTLE FORM
    document.getElementById('shuttleForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const token = localStorage.getItem('token');
      const destinationSelect = document.getElementById('Destination');
      const dest = destinationSelect.value;

      if (!dest) return alert("Select destination");

      try {
        const res = await fetch('/api/rides/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ ride_type: 'Shuttle', destination: dest, pickup_location: 'UNIBEN Campus' })
        });

        if (res.ok) {
          // Clear Input
          destinationSelect.value = '';

          // SHOW THE SPINNER
          const status = document.getElementById('booking-status');
          status.style.display = 'block';
          status.className = 'alert alert-info text-center fw-bold shadow-sm';
          status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing Shuttle Ticket to <strong>${dest}</strong>...`;
        }
      } catch (e) { console.error(e); }
    });

    // CHATBOT
    function toggleChat() { document.getElementById('chat-window').style.display = document.getElementById('chat-window').style.display === 'none' ? 'block' : 'none'; }
    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }
    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';
      addMessage('...', 'bot');
      try {
        const res = await fetch('/api/agent/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
        const d = await res.json();
        document.getElementById('chat-messages').lastChild.innerText = d.reply;
      } catch (e) { }
    }
    function addMessage(t, s) {
      const d = document.createElement('div');
      d.className = `mb-2 ${s === 'user' ? 'text-end' : 'text-start'}`;
      d.innerHTML = `<span class="p-2 rounded ${s === 'user' ? 'bg-purple text-white' : 'bg-white border'}">${t}</span>`;
      document.getElementById('chat-messages').appendChild(d);
    }
  </script>
</body>

</html>
