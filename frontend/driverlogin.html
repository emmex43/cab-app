<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Login Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">

          <!-- Favicon -->
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
        <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <!-- This is the style for only the driver login page -->
  <style>
    .bd-placeholder-img {
      font-size: 1.125rem;
      text-anchor: middle;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    @media (min-width: 768px) {
      .bd-placeholder-img-lg {
        font-size: 3.5rem;
      }
    }

    body {
      background-color: #F6F6F6;
      display: flex;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
    }

    .form-signin {
      width: 100%;
      max-width: 330px;
      padding: 15px;
      margin: auto;
    }

    .form-signin .checkbox {
      font-weight: 400;
    }

    .form-signin .form-floating:focus-within {
      z-index: 2;
    }

    .form-signin input[type="email"] {
      margin-bottom: -1px;
      border-bottom-right-radius: 0;
      border-bottom-left-radius: 0;
    }

    .form-signin input[type="password"] {
      margin-bottom: 10px;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

                    /* Navbar Cursive Logo */
        .tripuni-cursive-nav {
            font-family: 'Dancing Script', cursive; /* You can change 'Pacifico' to 'Dancing Script' to test it */
            font-size: 1.8rem; /* Cursive fonts need to be slightly larger to be readable */
            color: #FFFFFF;
            text-decoration: none;
            line-height: 1;
        }
        .tripuni-cursive-nav span {
            color: #FACC15; /* Yellow highlight for the 'Uni' part */
        }

        /* Hero Section Cursive Logo */
        .tripuni-cursive-hero {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem; /* Make it huge! */
            color: #FFFFFF;
            margin-bottom: 0;
            line-height: 1.2;
            /* A soft, glowing drop-shadow to make it readable over the dark images */
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.3), 
            0px 0px 20px rgba(140, 28, 100, 0.6); /* Subtle purple glow */
            /* Add a slight tilt for a fast, dynamic mobility feel */
            /* transform: rotate(-2deg);  */
            display: inline-block;
        }
            .tripuni-cursive-hero span {
            color: #FACC15; /* Yellow highlight for the 'Uni' part */
        }

  </style>

</head>

<body>

  <!-- This is the Login Form -->
  <main class="form-signin">
    <a href="driverhub.html" class="h6 mb-3 fw-normal" style="text-decoration: none;">Back to Driver's Hub</a>
    <form action="" method="">
      <img class="mb-4" src="../assets/images/logo.png" alt="" width="120" height="120">
      <h3 class="tripuni-cursive-hero" style="font-size: 60px; margin: 0; line-height: 1;">Trip<span>Uni</span></h3>
      <h2 class="h4 mb-2 fw-normal" style="margin-top: -20px;">Driver Login</h2>

      <div class="form-floating">
        <input type="email" name="email" class="form-control" id="floatingInput" placeholder="name@example.com"
          required>
        <label for="floatingInput">Email address</label>
      </div>
      <div class="form-floating">
        <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password"
          required>
        <label for="floatingPassword">Password</label>
      </div>

      <button class="w-100 btn btn-lg btn-purple" type="submit">Login</button>
      <p>Don't have an account? <a href="driverreg.html" style="color: #8C1C64;">Register Here</a></p>
      <p style="text-align: center; ">
        <a href="mailto:admintripuni@gmail.com" class="mt-5 mb-3 text-muted nav-link text-black"
          style="text-decoration: none;">admintripuni@gmail.com</a>
      </p>
    </form>
  </main>


  <!-- You can use id, class or name to target the elements in the form -->

  <!-- Dont touch this script links below it is the bootstrap and js links -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
    integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"></script>
  <script>
    document.querySelector('form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = {
        email: document.querySelector('input[name="email"]').value,
        password: document.querySelector('input[name="password"]').value
      };

      try {
        const response = await fetch('/api/auth/driver/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('user', JSON.stringify(data.user));
          alert('Driver login successful!');
          window.location.href = 'driverhub.html';
        } else {
          alert('Error: ' + data.error);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please try again.');
      }
    });
  </script>
</body>

</html>
